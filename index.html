<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nubank</title>
    
    <!-- Configurações para PWA / Tela Cheia no iPhone -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nubank">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #820ad1;
            color: #ffffff;
        }
        .nu-bg {
            background-color: #820ad1;
        }
    </style>
</head>
<body class="nu-bg min-h-screen flex flex-col justify-between selection:bg-purple-600 selection:text-white">

    <!-- Header do App -->
    <header class="px-5 pt-8 pb-4 flex items-center justify-between">
        <!-- Perfil / Bonequinho (Gatilho do Painel Secreto) -->
        <div class="relative">
            <button id="profile-btn" class="w-10 h-10 rounded-full bg-purple-700 flex items-center justify-center overflow-hidden border border-purple-500 focus:outline-none transition active:scale-95 shadow-inner">
                <img id="header-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Perfil" class="w-full h-full object-cover">
            </button>

            <!-- Painel de Controle Oculto no Bonequinho -->
            <div id="admin-panel" class="hidden absolute left-0 mt-3 w-72 bg-white text-gray-900 rounded-2xl shadow-2xl p-5 z-50 border border-gray-100">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-bold text-gray-800 text-sm flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-purple-700"></i> Painel de Configuração
                    </h3>
                    <button id="close-panel" class="text-gray-400 hover:text-gray-600 text-sm font-bold">✕</button>
                </div>
                
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Nome de Usuário (@):</label>
                        <input type="text" id="input-username" class="w-full text-xs px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600 bg-gray-50" value="@_notificacaomilionaria">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Novo Saldo (R$):</label>
                        <input type="text" id="input-balance" class="w-full text-xs px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600 bg-gray-50" value="10.000.000,00">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">URL da Foto de Perfil:</label>
                        <input type="text" id="input-avatar" class="w-full text-xs px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600 bg-gray-50" value="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150">
                    </div>
                    <button id="save-config" class="w-full bg-purple-700 hover:bg-purple-800 text-white font-medium py-2 rounded-lg text-xs transition shadow-md">
                        Atualizar Dados
                    </button>
                </div>
            </div>
        </div>

        <!-- Ícones do Topo -->
        <div class="flex items-center space-x-5 text-lg">
            <button class="focus:outline-none hover:opacity-85"><i class="fa-regular fa-eye text-white"></i></button>
            <button class="focus:outline-none hover:opacity-85"><i class="fa-regular fa-circle-question text-white"></i></button>
            <button class="focus:outline-none hover:opacity-85"><i class="fa-regular fa-user text-white"></i></button>
        </div>
    </header>

    <!-- Saudação -->
    <div class="px-5 pb-5">
        <h2 id="display-username" class="text-lg font-semibold text-white">Olá, @_notificacaomilionaria</h2>
    </div>

    <!-- Conteúdo Principal -->
    <main class="bg-white text-gray-900 rounded-t-3xl flex-1 px-5 pt-6 pb-12 flex flex-col space-y-6 shadow-xl">
        
        <!-- Seção Conta -->
        <div class="space-y-4">
            <div class="flex items-center justify-between cursor-pointer">
                <span class="font-bold text-lg text-gray-900">Conta</span>
                <i class="fa-solid fa-chevron-right text-gray-400 text-sm"></i>
            </div>
            <div>
                <h3 id="display-balance" class="text-xl font-bold text-gray-900">R$ 10.000.000,00</h3>
            </div>
        </div>

        <!-- Atalhos / Carrossel de Ações -->
        <div class="flex space-x-6 overflow-x-auto pb-2 scrollbar-none pt-1">
            <div class="flex flex-col items-center flex-shrink-0 cursor-pointer group">
                <div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center text-gray-800 text-lg group-hover:bg-gray-200 transition">
                    <i class="fa-solid fa-pix"></i>
                </div>
                <span class="text-xs font-medium mt-2 text-gray-800 text-center w-20">Área Pix</span>
            </div>
            <div class="flex flex-col items-center flex-shrink-0 cursor-pointer group">
                <div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center text-gray-800 text-lg group-hover:bg-gray-200 transition">
                    <i class="fa-solid fa-barcode"></i>
                </div>
                <span class="text-xs font-medium mt-2 text-gray-800 text-center w-20">Pagar</span>
            </div>
            <div class="flex flex-col items-center flex-shrink-0 cursor-pointer group">
                <div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center text-gray-800 text-lg group-hover:bg-gray-200 transition">
                    <i class="fa-solid fa-hand-holding-dollar"></i>
                </div>
                <span class="text-xs font-medium mt-2 text-gray-800 text-center w-20">Pegar emprestado</span>
            </div>
            <div class="flex flex-col items-center flex-shrink-0 cursor-pointer group">
                <div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center text-gray-800 text-lg group-hover:bg-gray-200 transition">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                </div>
                <span class="text-xs font-medium mt-2 text-gray-800 text-center w-20">Recarga de celular</span>
            </div>
            <div class="flex flex-col items-center flex-shrink-0 cursor-pointer group">
                <div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center text-gray-800 text-lg group-hover:bg-gray-200 transition">
                    <i class="fa-solid fa-arrow-right-arrow-left"></i>
                </div>
                <span class="text-xs font-medium mt-2 text-gray-800 text-center w-20">Transferir</span>
            </div>
        </div>

        <!-- Meus Cartões -->
        <div class="bg-gray-100 rounded-2xl p-4 flex items-center space-x-3 cursor-pointer hover:bg-gray-200/70 transition">
            <i class="fa-regular fa-credit-card text-gray-700 text-lg"></i>
            <span class="text-sm font-semibold text-gray-800">Meus cartões</span>
        </div>

        <!-- Card Propagandístico / Informacional -->
        <div class="bg-gray-100 rounded-2xl p-4 cursor-pointer hover:bg-gray-200/70 transition space-y-2">
            <p class="text-xs text-gray-600">Pague boletos no crédito em até 12x, direto pelo app</p>
        </div>

        <div class="border-t border-gray-200 pt-6 space-y-4">
            <div class="flex items-center justify-between cursor-pointer">
                <span class="font-bold text-lg text-gray-900">Cartão de crédito</span>
                <i class="fa-solid fa-chevron-right text-gray-400 text-sm"></i>
            </div>
            <div>
                <span class="text-xs text-gray-500 block">Fatura atual</span>
                <h3 class="text-xl font-bold text-gray-900">R$ 888.888,88</h3>
                <span class="text-xs text-gray-500">Limite disponível de R$ 819,91</span>
            </div>
        </div>

    </main>

    <!-- Barra de Navegação Inferior -->
    <nav class="bg-white border-t border-gray-200 px-6 py-3 flex justify-between items-center text-gray-600 fixed bottom-0 left-0 right-0 shadow-lg">
        <button class="flex flex-col items-center text-purple-700 focus:outline-none">
            <i class="fa-solid fa-arrow-right-arrow-left text-lg"></i>
        </button>
        <button class="flex flex-col items-center hover:text-purple-700 focus:outline-none">
            <i class="fa-solid fa-dollar-sign text-lg"></i>
        </button>
        <button class="flex flex-col items-center hover:text-purple-700 focus:outline-none">
            <i class="fa-bag-shopping fa-solid text-lg"></i>
        </button>
    </nav>

    <!-- Script de Interação -->
    <script>
        const profileBtn = document.getElementById('profile-btn');
        const adminPanel = document.getElementById('admin-panel');
        const closePanel = document.getElementById('close-panel');
        const saveConfig = document.getElementById('save-config');

        const inputUsername = document.getElementById('input-username');
        const inputBalance = document.getElementById('input-balance');
        const inputAvatar = document.getElementById('input-avatar');

        const displayUsername = document.getElementById('display-username');
        const displayBalance = document.getElementById('display-balance');
        const headerAvatar = document.getElementById('header-avatar');

        // Abrir/Fechar painel oculto no bonequinho
        profileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            adminPanel.classList.toggle('hidden');
        });

        closePanel.addEventListener('click', () => {
            adminPanel.classList.add('hidden');
        });

        // Fechar ao clicar fora
        window.addEventListener('click', (e) => {
            if (!adminPanel.contains(e.target) && !profileBtn.contains(e.target)) {
                adminPanel.classList.add('hidden');
            }
        });

        // Salvar as alterações feitas no painel
        saveConfig.addEventListener('click', () => {
            if (inputUsername.value) {
                displayUsername.innerText = `Olá, ${inputUsername.value}`;
            }
            if (inputBalance.value) {
                displayBalance.innerText = `R$ ${inputBalance.value}`;
            }
            if (inputAvatar.value) {
                headerAvatar.src = inputAvatar.value;
            }
            adminPanel.classList.add('hidden');
        });
    </script>
</body>
</html>
