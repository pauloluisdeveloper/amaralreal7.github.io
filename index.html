<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cópia Banco Inter</title>
    <!-- Tailwind CSS para estilização rápida e moderna -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">

    <!-- Contentor Principal (Simulador de Telemóvel) -->
    <div class="w-full max-w-md bg-gray-50 h-[844px] flex flex-col justify-between shadow-2xl relative overflow-hidden font-sans">
        
        <!-- Cabeçalho -->
        <header class="px-6 pt-8 pb-4 bg-white flex justify-between items-center shadow-xs">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-orange-600 text-white flex items-center font-bold justify-center text-lg">
                    UI
                </div>
                <div>
                    <span class="text-xs text-gray-500 block">Olá,</span>
                    <h1 class="text-sm font-bold text-gray-800">Usuário Inter</h1>
                </div>
            </div>
            <div class="flex items-center space-x-4 text-gray-600 text-lg">
                <i class="fa-regular fa-eye cursor-pointer"></i>
                <i class="fa-regular fa-bell cursor-pointer"></i>
            </div>
        </header>

        <!-- Corpo da Página -->
        <main class="flex-1 overflow-y-auto p-4 space-y-4">
            
            <!-- Card de Conta Digital -->
            <div class="bg-white p-5 rounded-2xl shadow-xs border border-gray-100">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-semibold text-gray-400 tracking-wider">CONTA DIGITAL</span>
                    <span class="text-xs bg-emerald-50 text-emerald-600 font-medium px-2 py-0.5 rounded-full flex items-center gap-1">
                        <i class="fa-solid fa-chart-line text-[10px]"></i> 100% CDI
                    </span>
                </div>
                <div class="flex justify-between items-center mb-1">
                    <h2 class="text-2xl font-extrabold text-gray-900">R$ 4.850,20</h2>
                    <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
                </div>
                <p class="text-xs text-gray-500">Rendimento total: <span class="text-emerald-600 font-medium">+R$ 38,40</span> este mês</p>
            </div>

            <!-- Atalhos / Ações Rápidas -->
            <div class="grid grid-cols-4 gap-3">
                <!-- Pix -->
                <div class="bg-white p-3 rounded-2xl flex flex-col items-center justify-center text-center shadow-xs border border-gray-100 cursor-pointer hover:bg-orange-50 transition">
                    <div class="w-12 h-12 bg-orange-50 text-orange-600 rounded-2xl flex items-center justify-center mb-2 text-lg">
                        <i class="fa-solid fa-bolt"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-700">Pix</span>
                </div>
                <!-- Cartões -->
                <div class="bg-white p-3 rounded-2xl flex flex-col items-center justify-center text-center shadow-xs border border-gray-100 cursor-pointer hover:bg-orange-50 transition">
                    <div class="w-12 h-12 bg-orange-50 text-orange-600 rounded-2xl flex items-center justify-center mb-2 text-lg">
                        <i class="fa-solid fa-credit-card"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-700">Cartões</span>
                </div>
                <!-- Investir -->
                <div class="bg-white p-3 rounded-2xl flex flex-col items-center justify-center text-center shadow-xs border border-gray-100 cursor-pointer hover:bg-orange-50 transition">
                    <div class="w-12 h-12 bg-orange-50 text-orange-600 rounded-2xl flex items-center justify-center mb-2 text-lg">
                        <i class="fa-solid fa-chart-pie"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-700">Investir</span>
                </div>
                <!-- Inter Shop -->
                <div class="bg-white p-3 rounded-2xl flex flex-col items-center justify-center text-center shadow-xs border border-gray-100 cursor-pointer hover:bg-orange-50 transition">
                    <div class="w-12 h-12 bg-orange-50 text-orange-600 rounded-2xl flex items-center justify-center mb-2 text-lg">
                        <i class="fa-solid fa-bag-shopping"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-700">Inter Shop</span>
                </div>
            </div>

            <!-- Últimas Transações -->
            <div class="bg-white p-4 rounded-2xl shadow-xs border border-gray-100">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-sm font-bold text-gray-800">Últimas Transações</h3>
                    <span class="text-xs font-bold text-orange-600 cursor-pointer">Ver extrato</span>
                </div>

                <div class="space-y-4">
                    <!-- Transação 1 -->
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center">
                                <i class="fa-solid fa-arrow-up text-sm"></i>
                            </div>
                            <div>
                                <h4 class="text-xs font-bold text-gray-800">Pix Enviado</h4>
                                <p class="text-[10px] text-gray-400">Hoje, 14:20</p>
                            </div>
                        </div>
                        <span class="text-xs font-bold text-rose-600">- R$ 150,00</span>
                    </div>

                    <!-- Transação 2 -->
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center">
                                <i class="fa-solid fa-arrow-down text-sm"></i>
                            </div>
                            <div>
                                <h4 class="text-xs font-bold text-gray-800">Pix Recebido</h4>
                                <p class="text-[10px] text-gray-400">Ontem, 09:15</p>
                            </div>
                        </div>
                        <span class="text-xs font-bold text-emerald-600">+ R$ 1.200,00</span>
                    </div>
                </div>
            </div>

        </main>

        <!-- Barra de Navegação Inferior -->
        <nav class="bg-white border-t border-gray-200 py-2 px-6 flex justify-between items-center text-center">
            <div class="flex flex-col items-center text-orange-600 cursor-pointer">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] font-medium mt-1">Início</span>
            </div>
            <div class="flex flex-col items-center text-gray-400 cursor-pointer hover:text-orange-600 transition">
                <i class="fa-solid fa-bolt text-lg"></i>
                <span class="text-[10px] font-medium mt-1">Pix</span>
            </div>
            <div class="flex flex-col items-center text-gray-400 cursor-pointer hover:text-orange-600 transition">
                <i class="fa-solid fa-credit-card text-lg"></i>
                <span class="text-[10px] font-medium mt-1">Cartões</span>
            </div>
            <div class="flex flex-col items-center text-gray-400 cursor-pointer hover:text-orange-600 transition">
                <i class="fa-solid fa-chart-pie text-lg"></i>
                <span class="text-[10px] font-medium mt-1">Investir</span>
            </div>
            <div class="flex flex-col items-center text-gray-400 cursor-pointer hover:text-orange-600 transition">
                <i class="fa-solid fa-bag-shopping text-lg"></i>
                <span class="text-[10px] font-medium mt-1">Shop</span>
            </div>
        </nav>

    </div>

</body>
</html>
