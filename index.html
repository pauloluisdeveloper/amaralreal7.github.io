<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nubank</title>
    
    <!-- Configuração PWA Otimizada -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nubank">
    <meta name="application-name" content="Nubank">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Ícone Oficial do Nubank -->
    <link rel="apple-touch-icon" href="https://i.postimg.cc/ctx6JqZ2/IMG-2108.jpg">
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/ctx6JqZ2/IMG-2108.jpg">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: env(safe-area-inset-top, 20px) 15px env(safe-area-inset-bottom, 20px) 15px;
        }

        /* Painel centralizado exatamente no meio da tela */
        .mobile-container {
            width: 100%;
            max-width: 360px;
            background-color: #000000;
            border: 1px solid #1a1a1a;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            overflow: hidden;
            padding: 24px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nu-logo-box {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #820AD1;
            flex-shrink: 0;
        }

        .nu-logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .title-app {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #fff;
        }

        .btn-reload {
            background-color: #121212;
            border: 1px solid #262626;
            color: #888;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-reload svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            transition: transform 0.4s ease;
        }

        .btn-reload.rotating svg {
            transform: rotate(360deg);
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.75rem;
            color: #777;
            font-weight: 500;
        }

        input {
            width: 100%;
            background-color: #0b0b0b;
            border: 1px solid #1f1f1f;
            color: #ffffff;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #820AD1;
        }

        .btn-nu {
            background: linear-gradient(135deg, #820AD1 0%, #6805a8 100%);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
            box-shadow: 0 4px 15px rgba(130, 10, 209, 0.3);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-nu:active {
            transform: scale(0.98);
        }

        .btn-white-vip {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(255,255,255,0.1);
        }

        .vip-badge {
            background-color: #820AD1;
            color: #fff;
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .status-device {
            font-size: 0.65rem;
            color: #555;
            text-align: center;
            margin-top: -4px;
        }

        /* Notificação ajustada para cair perfeitamente logo abaixo da ilha dinâmica do iPhone */
        #bank-notification {
            position: fixed;
            top: 45px;
            left: 50%;
            transform: translateX(-50%) translateY(-150px);
            width: 90%;
            max-width: 380px;
            background: rgba(18, 18, 18, 0.98);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(130, 10, 209, 0.4);
            color: #fff;
            padding: 14px 16px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 99999;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #bank-notification.show {
            transform: translateX(-50%) translateY(0);
        }

        .notif-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background-color: #820AD1;
        }

        .notif-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .notif-content {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
        }

        .notif-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }

        .notif-app-name {
            font-size: 0.65rem;
            color: #a855f7;
            font-weight: 700;
            text-transform: uppercase;
        }

        .notif-time {
            font-size: 0.6rem;
            color: #888;
        }

        .notif-text {
            font-size: 0.85rem;
            color: #f3f4f6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .notif-text b {
            font-weight: 600;
            color: #fff;
        }

        /* Modal de Checkout Pix / Resgate de Key */
        #vip-checkout-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        #vip-checkout-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .checkout-card {
            width: 90%;
            max-width: 320px;
            background-color: #0c0c0c;
            border: 1px solid #262626;
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #vip-checkout-overlay.active .checkout-card {
            transform: scale(1);
        }

        .checkout-title {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .checkout-subtitle {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 14px;
        }

        .qr-placeholder {
            width: 130px;
            height: 130px;
            background-color: #fff;
            border-radius: 12px;
            margin: 0 auto 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }

        .qr-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .pix-copy-box {
            background-color: #141414;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 8px;
            font-size: 0.65rem;
            color: #aaa;
            word-break: break-all;
            margin-bottom: 10px;
            max-height: 45px;
            overflow-y: auto;
        }

        .key-input-area {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
        }

        .key-input-area label {
            font-size: 0.7rem;
            color: #aaa;
        }

        .btn-action-checkout {
            background: linear-gradient(135deg, #820AD1 0%, #6805a8 100%);
            color: #fff;
            border: none;
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(130, 10, 209, 0.3);
        }

        .btn-close-checkout {
            background: transparent;
            color: #666;
            border: none;
            font-size: 0.75rem;
            cursor: pointer;
            padding: 6px;
            margin-top: 4px;
        }
    </style>
</head>
<body onload="identificarDispositivoIP()">

    <div class="mobile-container">
        <div class="top-bar">
            <div class="top-left">
                <div class="nu-logo-box">
                    <img src="https://i.postimg.cc/ctx6JqZ2/IMG-2108.jpg" alt="Nubank Logo">
                </div>
                <div class="title-app">Nubank</div>
            </div>
            <button class="btn-reload" id="reloadBtn" onclick="atualizarSistemaInstantaneo()" title="Atualizar Sistema">
                <svg viewBox="0 0 24 24">
                    <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                </svg>
            </button>
        </div>

        <div class="content">
            <div class="form-group">
                <label>Nome do Pagador</label>
                <input type="text" id="nomePagador" value="Carlos Eduardo">
            </div>

            <div class="form-group">
                <label>Valor Recebido (R$)</label>
                <input type="text" id="valorPix" value="250,00">
            </div>

            <button class="btn-nu" onclick="dispararNotificacao()">
                <span>Gerar Notificação Pix</span>
            </button>
            
            <!-- Botão VIP -->
            <button class="btn-white-vip" onclick="abrirCheckoutVip()">
                <span id="btnVipText">Ativar Notificações Reais</span>
                <span class="vip-badge" id="vipBadgeStatus">VIP</span>
            </button>
            <div class="status-device" id="ipStatusText">Identificando dispositivo...</div>
        </div>
    </div>

    <!-- Notificação Visual Direta -->
    <div id="bank-notification">
        <div class="notif-icon">
            <img src="https://i.postimg.cc/ctx6JqZ2/IMG-2108.jpg" alt="Nubank Logo">
        </div>
        <div class="notif-content">
            <div class="notif-header-row">
                <span class="notif-app-name">Nubank</span>
                <span class="notif-time">agora</span>
            </div>
            <div class="notif-text" id="notifBodyText">Você recebeu um Pix de <b>R$ 250,00</b> de Carlos Eduardo</div>
        </div>
    </div>

    <!-- Modal de Checkout Pix e Resgate de Key -->
    <div id="vip-checkout-overlay">
        <div class="checkout-card">
            <div class="checkout-title">Ativação VIP</div>
            <div class="checkout-subtitle">Pague via Pix ou digite sua Key de acesso</div>
            
            <div class="qr-placeholder">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=00020126580014br.gov.bcb.pix..." alt="QR Code Pix">
            </div>

            <div class="pix-copy-box" id="pixCopiaColaText">
                00020126580014br.gov.bcb.pix0136...
            </div>
            <button class="btn-action-checkout" style="padding: 8px; font-size: 0.75rem; margin-bottom: 10px;" onclick="copiarChavePix()">Copiar Código Pix</button>

            <div class="key-input-area">
                <label>Já pagou? Digite sua Key:</label>
                <input type="text" id="inputUserKey" placeholder="EX: VIP-XXXX-YYYY">
                <button class="btn-action-checkout" onclick="validarKeyDeAcesso()">Ativar com Key</button>
            </div>

            <button class="btn-close-checkout" onclick="fecharCheckoutVip()">Fechar</button>
        </div>
    </div>

    <script>
        let meuIPGlobal = "";

        // Função para capturar o IP real do usuário ao abrir a página
        async function identificarDispositivoIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                meuIPGlobal = data.ip;
                document.getElementById('ipStatusText').innerText = `ID do Dispositivo: ${meuIPGlobal.substring(0, 8)}... (Seguro)`;
                
                // Verifica se este dispositivo já está liberado no navegador
                const vipAtivo = localStorage.getItem('nubank_vip_liberado_' + meuIPGlobal);
                if(vipAtivo === "true") {
                    aplicarModoLiberado();
                }
            } catch (e) {
                document.getElementById('ipStatusText').innerText = `Dispositivo Online`;
            }
        }

        function aplicarModoLiberado() {
            document.getElementById('btnVipText').innerText = "Sistema VIP Ativo";
            document.getElementById('vipBadgeStatusstyle = background-color: #00C853;');
            const badge = document.getElementById('vipBadgeStatus');
            badge.innerText = "ATIVO";
            badge.style.backgroundColor = "#00C853";
        }

        function atualizarSistemaInstantaneo() {
            const btn = document.getElementById('reloadBtn');
            btn.classList.add('rotating');
            setTimeout(() => {
                const urlAtual = window.location.href.split('?')[0];
                window.location.href = urlAtual + '?v=' + new Date().getTime();
            }, 300);
        }

        function abrirCheckoutVip() {
            // Se já estiver liberado, avisa o usuário
            const vipAtivo = localStorage.getItem('nubank_vip_liberado_' + meuIPGlobal);
            if(vipAtivo === "true") {
                alert("Este dispositivo já possui acesso VIP liberado!");
                return;
            }
            document.getElementById('vip-checkout-overlay').classList.add('active');
        }

        function fecharCheckoutVip() {
            document.getElementById('vip-checkout-overlay').classList.remove('active');
        }

        function copiarChavePix() {
            const codigoPix = "00020126580014br.gov.bcb.pix...";
            navigator.clipboard.writeText(codigoPix).then(() => {
                alert("Código Pix Copia e Cola copiado!");
            });
        }

        // Validação da Key digitada pelo cliente
        function validarKeyDeAcesso() {
            const keyDigitada = document.getElementById('inputUserKey').value.trim();
            
            // Aqui futuramente você validará com a sua planilha/banco. 
            // Para teste, vamos definir que qualquer chave que comece com "VIP-" ou uma chave mestre libera o acesso:
            if(keyDigitada.startsWith("VIP-") && keyDigitada.length > 6) {
                localStorage.setItem('nubank_vip_liberado_' + meuIPGlobal, "true");
                aplicarModoLiberado();
                fecharCheckoutVip();
                alert("Parabéns! Acesso VIP liberado com sucesso neste dispositivo.");
            } else {
                alert("Key inválida ou não encontrada. Verifique o pagamento.");
            }
        }

        function dispararNotificacao() {
            const nome = document.getElementById('nomePagador').value || "Carlos Eduardo";
            const valor = document.getElementById('valorPix').value || "250,00";

            const txt = document.getElementById('notifBodyText');
            if(txt) {
                txt.innerHTML = `Você recebeu um Pix de <b>R$ ${valor}</b> de ${nome}`;
            }

            const notif = document.getElementById('bank-notification');
            if(notif) {
                notif.classList.add('show');
            }

            if ("vibrate" in navigator) {
                try { navigator.vibrate(80); } catch(e) {}
            }

            setTimeout(() => {
                if(notif) {
                    notif.classList.remove('show');
                }
            }, 5000);
        }
    </script>
</body>
</html>
