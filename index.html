<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nubank</title>
    
    <!-- Configuração PWA Completa -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nubank">
    <meta name="application-name" content="Nubank">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Ícone Oficial do Nubank -->
    <link rel="apple-touch-icon" href="https://i.postimg.cc/ctx6JqZ2/IMG-2108.jpg">
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/ctx6JqZ2/IMG-2108.jpg">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: env(safe-area-inset-top, 20px) 15px env(safe-area-inset-bottom, 20px) 15px;
        }

        /* Card VIP Compacto, Fundo Totalmente Preto */
        .mobile-container {
            width: 100%;
            max-width: 360px;
            background-color: #000000;
            border: 1px solid #1a1a1a;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            overflow: hidden;
            padding: 24px;
            margin-top: env(safe-area-inset-top, 0px);
        }

        /* Top Bar com Logo e Nome Nubank */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nu-logo-box {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #820AD1;
            flex-shrink: 0;
        }

        .nu-logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .title-app {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #fff;
        }

        /* Botão de Atualizar em Tempo Real (Bula o Cache do GitHub instantaneamente) */
        .btn-reload {
            background-color: #121212;
            border: 1px solid #262626;
            color: #888;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-reload:hover {
            background-color: #222;
            color: #fff;
            border-color: #444;
        }

        .btn-reload svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            transition: transform 0.4s ease;
        }

        .btn-reload.rotating svg {
            transform: rotate(360deg);
        }

        /* Content Area */
        .content {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.75rem;
            color: #777;
            font-weight: 500;
        }

        input {
            width: 100%;
            background-color: #0b0b0b;
            border: 1px solid #1f1f1f;
            color: #ffffff;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #820AD1;
        }

        /* Botão Profissional Nubank */
        .btn-nu {
            background: linear-gradient(135deg, #820AD1 0%, #6805a8 100%);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
            box-shadow: 0 4px 15px rgba(130, 10, 209, 0.3);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-nu:active {
            transform: scale(0.98);
        }

        /* Botão Branco White de Notificações com Selo VIP */
        .btn-white-vip {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(255,255,255,0.1);
        }

        .btn-white-vip:hover {
            background-color: #e6e6e6;
        }

        .vip-badge {
            background-color: #820AD1;
            color: #fff;
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Notificação Visual no Topo (Perfeita, Limpa e sem duplicar nomes) */
        #bank-notification {
            position: fixed;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 380px;
            background: rgba(12, 12, 12, 0.98);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px 14px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #bank-notification.show {
            top: max(20px, env(safe-area-inset-top, 20px));
        }

        .notif-icon {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background-color: #820AD1;
        }

        .notif-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .notif-content {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
        }

        .notif-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }

        .notif-app-name {
            font-size: 0.65rem;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
        }

        .notif-time {
            font-size: 0.6rem;
            color: #555;
        }

        .notif-text {
            font-size: 0.85rem;
            color: #f3f4f6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .notif-text b {
            font-weight: 600;
            color: #fff;
        }

        /* Modal VIP Personalizado */
        #vip-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        #vip-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .vip-modal-card {
            width: 85%;
            max-width: 310px;
            background-color: #0c0c0c;
            border: 1px solid #222;
            border-radius: 22px;
            padding: 22px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #vip-modal-overlay.active .vip-modal-card {
            transform: scale(1);
        }

        .vip-modal-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            background-color: #820AD1;
            margin: 0 auto 14px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(130, 10, 209, 0.4);
        }

        .vip-modal-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .vip-modal-title {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        .vip-modal-desc {
            font-size: 0.8rem;
            color: #999;
            line-height: 1.4;
            margin-bottom: 18px;
        }

        .vip-modal-btn {
            background: linear-gradient(135deg, #820AD1 0%, #6805a8 100%);
            color: #fff;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(130, 10, 209, 0.3);
        }
    </style>
</head>
<body>

    <!-- Container VIP Compacto Black -->
    <div class="mobile-container">
        <div class="top-bar">
            <div class="top-left">
                <div class="nu-logo-box">
                    <img src="https://i.postimg.cc/ctx6JqZ2/IMG-2108.jpg" alt="Nubank Logo">
                </div>
                <div class="title-app">Nubank</div>
            </div>
            <!-- Botão de Atualizar Instantâneo (Bula o cache do GitHub Pages) -->
            <button class="btn-reload" id="reloadBtn" onclick="atualizarSistemaInstantaneo()" title="Atualizar Sistema">
                <svg viewBox="0 0 24 24">
                    <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                </svg>
            </button>
        </div>

        <!-- Formulário Principal -->
        <div class="content">
            <div class="form-group">
                <label>Nome do Pagador</label>
                <input type="text" id="nomePagador" value="Carlos Eduardo">
            </div>

            <div class="form-group">
                <label>Valor Recebido (R$)</label>
                <input type="text" id="valorPix" value="250,00">
            </div>

            <button class="btn-nu" onclick="dispararNotificacao()">
                <span>Gerar Notificação Pix</span>
            </button>
            
            <button class="btn-white-vip" onclick="ativarNotificacoesVip()">
                <span>Ativar Notificações Reais</span>
                <span class="vip-badge">VIP</span>
            </button>
        </div>
    </div>

    <!-- Notificação Visual no Topo (Perfeita, limpa, sem duplicidade de nomes) -->
    <div id="bank-notification">
        <div class="notif-icon">
            <img src="https://i.postimg.cc/ctx6JqZ2/IMG-2108.jpg" alt="Nubank Logo">
        </div>
        <div class="notif-content">
            <div class="notif-header-row">
                <span class="notif-app-name">Nubank</span>
                <span class="notif-time">agora</span>
            </div>
            <div class="notif-text" id="notifBodyText">Você recebeu um Pix de <b>R$ 250,00</b> de Carlos Eduardo</div>
        </div>
    </div>

    <!-- Modal VIP Personalizado -->
    <div id="vip-modal-overlay">
        <div class="vip-modal-card">
            <div class="vip-modal-icon">
                <img src="https://i.postimg.cc/ctx6JqZ2/IMG-2108.jpg" alt="Nubank">
            </div>
            <div class="vip-modal-title" id="vipModalTitle">Notificações VIP</div>
            <div class="vip-modal-desc" id="vipModalDesc">Sistema de alertas sincronizado com sucesso.</div>
            <button class="vip-modal-btn" onclick="fecharModalVip()">Entendido</button>
        </div>
    </div>

    <script>
        // Função anti-delay do GitHub: Atualiza a página instantaneamente ignorando o cache
        function atualizarSistemaInstantaneo() {
            const btn = document.getElementById('reloadBtn');
            btn.classList.add('rotating');

            setTimeout(() => {
                const urlAtual = window.location.href.split('?')[0];
                const timestampBypass = '?v=' + new Date().getTime();
                window.location.href = urlAtual + timestampBypass;
            }, 300);
        }

        // Mostrar Modal VIP customizado
        function mostrarModalVip(titulo, descricao) {
            document.getElementById('vipModalTitle').innerText = titulo;
            document.getElementById('vipModalDesc').innerText = descricao;
            document.getElementById('vip-modal-overlay').classList.add('active');
        }

        function fecharModalVip() {
            document.getElementById('vip-modal-overlay').classList.remove('active');
        }

        // Ativar Alertas VIP
        function ativarNotificacoesVip() {
            mostrarModalVip("Notificações VIP Ativadas", "O sistema de alertas em tempo real do Nubank está configurado e pronto para uso.");
        }

        // Disparar Notificação Visual Limpa (Sem duplicar nomes na tela)
        function dispararNotificacao() {
            const nome = document.getElementById('nomePagador').value || "Carlos Eduardo";
            const valor = document.getElementById('valorPix').value || "250,00";

            // Atualiza o texto da notificação visual superior com precisão absoluta
            document.getElementById('notifBodyText').innerHTML = `Você recebeu um Pix de <b>R$ ${valor}</b> de ${nome}`;

            const notif = document.getElementById('bank-notification');
            notif.classList.add('show');

            // Vibração sutil ao receber o Pix se suportada pelo aparelho
            if ("vibrate" in navigator) {
                navigator.vibrate(60);
            }

            setTimeout(() => {
                notif.classList.remove('show');
            }, 4500);
        }
    </script>
</body>
</html>
