<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gerador de Notificações</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Container Centralizado */
        .mobile-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-y: auto;
            padding-bottom: 40px;
        }

        @media (min-width: 480px) {
            .mobile-container {
                height: 88vh;
                border-radius: 36px;
                border: 2px solid #222;
            }
        }

        /* Top Bar */
        .top-bar {
            padding: 24px 20px 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-app {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #fff;
        }

        .admin-shield {
            background: #000;
            border: 1.5px solid #ffffff;
            color: #ffffff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        /* Content Area */
        .content {
            padding: 5px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            color: #888;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            background-color: #111111;
            border: 1px solid #262626;
            color: #ffffff;
            padding: 13px;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #666;
        }

        /* Botão Branco White */
        .btn-white {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
        }

        .btn-white:hover {
            opacity: 0.9;
        }

        /* Notificação Visual Estilo Banco no Topo */
        #bank-notification {
            position: fixed;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 390px;
            background: rgba(20, 20, 20, 0.96);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 12px 14px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #bank-notification.show {
            top: 20px;
        }

        .notif-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .notif-content {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
        }

        .notif-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }

        .notif-app-name {
            font-size: 0.7rem;
            color: #aaa;
            font-weight: 600;
            text-transform: uppercase;
        }

        .notif-time {
            font-size: 0.65rem;
            color: #777;
        }

        .notif-text {
            font-size: 0.88rem;
            color: #f3f4f6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .notif-text b {
            font-weight: 600;
        }

        /* Modal de Administração */
        #admin-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 20px;
        }

        .admin-box {
            background: #111;
            border: 1px solid #333;
            width: 100%;
            max-width: 360px;
            padding: 24px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .admin-box h3 {
            font-size: 1.1rem;
        }

        .admin-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-close {
            background: #222;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            flex: 1;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-save {
            background: #fff;
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 8px;
            flex: 1;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- Top Bar com Selo de Escudo Branco -->
        <div class="top-bar">
            <div class="title-app" id="uiTitle">Gerador de Notificações</div>
            <div class="admin-shield" onclick="abrirAdmin()" title="Painel de Administração">🛡️</div>
        </div>

        <!-- Formulário Principal -->
        <div class="content">
            <div class="form-group">
                <label>Banco / Carteira</label>
                <select id="bancoSelect">
                    <option value="nubank">Nubank</option>
                    <option value="inter">Inter</option>
                    <option value="picpay">PicPay</option>
                </select>
            </div>

            <div class="form-group">
                <label>Nome do Pagador</label>
                <input type="text" id="nomePagador" value="Carlos Eduardo">
            </div>

            <div class="form-group">
                <label>Valor Recebido (R$)</label>
                <input type="text" id="valorPix" value="250,00">
            </div>

            <div class="form-group">
                <label>Toque de Notificação</label>
                <select id="somSelect">
                    <option value="iphone">Sino do iPhone (Tri-tone)</option>
                    <option value="android">Toque do Android (Beep)</option>
                </select>
            </div>

            <button class="btn-white" onclick="dispararNotificacao()" id="uiBtnText">Gerar Notificação Pix</button>
        </div>
    </div>

    <!-- Notificação Visual Integrada -->
    <div id="bank-notification">
        <div class="notif-icon" id="notifIconBox">⚡</div>
        <div class="notif-content">
            <div class="notif-header-row">
                <span class="notif-app-name" id="notifAppName">Nubank</span>
                <span class="notif-time">agora</span>
            </div>
            <div class="notif-text" id="notifBodyText">Você recebeu um Pix de <b>R$ 250,00</b> de Carlos Eduardo</div>
        </div>
    </div>

    <!-- Modal de Administração -->
    <div id="admin-modal">
        <div class="admin-box">
            <h3>Área de Administração</h3>
            <p style="font-size: 0.8rem; color: #888;">Controle restrito ao proprietário.</p>
            
            <div class="form-group">
                <label>Senha de Acesso</label>
                <input type="password" id="adminPass" placeholder="Senha (padrão: admin)">
            </div>

            <div id="adminEditArea" style="display:none; flex-direction: column; gap: 12px;">
                <div class="form-group">
                    <label>Título do App</label>
                    <input type="text" id="editTitle" value="Gerador de Notificações">
                </div>
                <div class="form-group">
                    <label>Texto do Botão</label>
                    <input type="text" id="editBtn" value="Gerar Notificação Pix">
                </div>
            </div>

            <div class="admin-actions">
                <button class="btn-close" onclick="fecharAdmin()">Fechar</button>
                <button class="btn-save" onclick="salvarAdmin()">Salvar</button>
            </div>
        </div>
    </div>

    <script>
        const bancosConfig = {
            nubank: { nome: 'Nubank', cor: '#820AD1', icone: 'Nu' },
            inter: { nome: 'Banco Inter', cor: '#FF7A00', icone: 'Inter' },
            picpay: { nome: 'PicPay', cor: '#11C76F', icone: 'Pay' }
        };

        window.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem('appTitle')) document.getElementById('uiTitle').innerText = localStorage.getItem('appTitle');
            if(localStorage.getItem('appBtn')) document.getElementById('uiBtnText').innerText = localStorage.getItem('appBtn');
        });

        // Disparar Notificação perfeitamente alinhada
        function dispararNotificacao() {
            const bancoKey = document.getElementById('bancoSelect').value;
            const banco = bancosConfig[bancoKey];
            const nome = document.getElementById('nomePagador').value || "Alguém";
            const valor = document.getElementById('valorPix').value || "0,00";
            const somTipo = document.getElementById('somSelect').value;

            const iconBox = document.getElementById('notifIconBox');
            iconBox.innerText = banco.icone;
            iconBox.style.backgroundColor = banco.cor;
            iconBox.style.color = '#fff';

            document.getElementById('notifAppName').innerText = banco.nome;
            document.getElementById('notifBodyText').innerHTML = `Você recebeu um Pix de <b>R$ ${valor}</b> de ${nome}`;

            const notif = document.getElementById('bank-notification');
            notif.classList.add('show');

            tocarSom(somTipo);

            setTimeout(() => {
                notif.classList.remove('show');
            }, 4000);
        }

        // Sistema de som via Web Audio API (Sino iPhone / Beep Android)
        function tocarSom(tipo) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (tipo === 'iphone') {
                    tocarNota(ctx, 659.25, 0, 0.12);    // E5
                    tocarNota(ctx, 830.61, 0.12, 0.12); // G#5
                    tocarNota(ctx, 987.77, 0.24, 0.35); // B5 (Sino)
                } else {
                    tocarNota(ctx, 1046.50, 0, 0.15);  // C6 (Android)
                }
            } catch (e) {
                // Áudio bloqueado pelo navegador antes do clique
            }
        }

        function tocarNota(ctx, freq, inicio, duracao) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + inicio);
            
            gain.gain.setValueAtTime(0.2, ctx.currentTime + inicio);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + inicio + duracao);
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            osc.start(ctx.currentTime + inicio);
            osc.stop(ctx.currentTime + inicio + duracao);
        }

        // Painel Admin
        function abrirAdmin() {
            document.getElementById('admin-modal').style.display = 'flex';
        }

        function fecharAdmin() {
            document.getElementById('admin-modal').style.display = 'none';
            document.getElementById('adminPass').value = '';
            document.getElementById('adminEditArea').style.display = 'none';
        }

        function salvarAdmin() {
            const pass = document.getElementById('adminPass').value;
            const editArea = document.getElementById('adminEditArea');

            if (pass === 'admin' || editArea.style.display === 'flex') {
                if (editArea.style.display !== 'flex') {
                    editArea.style.display = 'flex';
                    document.getElementById('editTitle').value = document.getElementById('uiTitle').innerText;
                    document.getElementById('editBtn').value = document.getElementById('uiBtnText').innerText;
                    alert('Senha correta! Modifique os campos e clique em Salvar.');
                    return;
                }

                const novoTitulo = document.getElementById('editTitle').value;
                const novoBtn = document.getElementById('editBtn').value;

                document.getElementById('uiTitle').innerText = novoTitulo;
                document.getElementById('uiBtnText').innerText = novoBtn;

                localStorage.setItem('appTitle', novoTitulo);
                localStorage.setItem('appBtn', novoBtn);

                fecharAdmin();
                alert('Alterações salvas permanentemente!');
            } else {
                alert('Senha incorreta!');
            }
        }
    </script>
</body>
</html>
