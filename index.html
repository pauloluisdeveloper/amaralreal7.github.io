<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - Nubank VIP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #050505; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .admin-container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 16px; }
        
        .header-admin { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 12px; }
        .header-admin h0, h1 { font-size: 1.1rem; color: #a855f7; font-weight: 700; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-card { background: #111; border: 1px solid #222; padding: 14px; border-radius: 16px; text-align: center; }
        .stat-card span { font-size: 0.7rem; color: #888; text-transform: uppercase; font-weight: 600; }
        .stat-card h2 { font-size: 1.2rem; color: #fff; margin-top: 4px; }

        .logs-section { background: #0c0c0c; border: 1px solid #222; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
        .logs-title { font-size: 0.85rem; font-weight: 700; color: #ccc; display: flex; justify-content: space-between; align-items: center; }
        
        .log-item { background: #141414; border: 1px solid #1f1f1f; padding: 10px; border-radius: 10px; display: flex; flex-direction: column; gap: 4px; font-size: 0.75rem; }
        .log-row { display: flex; justify-content: space-between; color: #aaa; }
        .log-row b { color: #fff; }
        .badge-ativo { color: #00C853; font-weight: 800; }

        .btn-refresh { background: #820AD1; color: #fff; border: none; padding: 10px; border-radius: 10px; font-weight: 700; cursor: pointer; text-align: center; font-size: 0.85rem; }
    </style>
</head>
<body onload="carregarDadosAdmin()">

    <div class="admin-container">
        <div class="header-admin">
            <h1>Painel Admin VIP</h1>
            <span style="font-size: 0.7rem; color: #00C853; font-weight: 700;">● LIVE</span>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span>Total Ativações</span>
                <h2 id="totalVendasNum">0</h2>
            </div>
            <div class="stat-card">
                <span>Faturamento Est.</span>
                <h2 id="faturamentoNum">R$ 0,00</h2>
            </div>
        </div>

        <button class="btn-refresh" onclick="carregarDadosAdmin()">Atualizar Dados em Tempo Real</button>

        <div class="logs-section">
            <div class="logs-title">
                <span>Logs de Vendas / Ativações</span>
                <span id="statusSync" style="font-size: 0.65rem; color: #666;">Sincronizado</span>
            </div>
            <div id="listaLogs" style="display: flex; flex-direction: column; gap: 8px; max-height: 350px; overflow-y: auto;">
                <div style="text-align: center; color: #688; padding: 20px; font-size: 0.8rem;">Carregando dados da planilha...</div>
            </div>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxuvhvS8auXVaaGJ_P0P4LirQfxDEfpeOGteLAOXA0Y3dDrmUwXmVlWeQ4-O2A_Yqp8/exec";

        async function carregarDadosAdmin() {
            document.getElementById('statusSync').innerText = "Atualizando...";
            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ acao: "admin_dados" })
                });
                const res = await response.json();
                
                if(res.status === "sucesso") {
                    document.getElementById('totalVendasNum').innerText = res.totalVendas;
                    document.getElementById('faturamentoNum').innerText = `R$ ${res.faturamento}`;
                    
                    const lista = document.getElementById('listaLogs');
                    lista.innerHTML = "";
                    
                    if(res.registros.length === 0) {
                        lista.innerHTML = `<div style="text-align: center; color: #666; padding: 20px; font-size: 0.8rem;">Nenhuma venda registrada ainda.</div>`;
                    } else {
                        res.registros.forEach(reg => {
                            lista.innerHTML += `
                                <div class="log-item">
                                    <div class="log-row"><span>Dispositivo: <b>${reg.deviceId.substring(0, 16)}...</b></span> <span class="badge-ativo">${reg.status}</span></div>
                                    <div class="log-row"><span>Key: <b>${reg.key}</b></span> <span>${reg.data}</span></div>
                                </div>
                            `;
                        });
                    }
                    document.getElementById('statusSync').innerText = "Atualizado agora";
                }
            } catch(e) {
                document.getElementById('statusSync').innerText = "Erro de conexão";
            }
        }
    </script>
</body>
</html>
