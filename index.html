<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gerador de Notificações</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Container Mobile PWA */
        .mobile-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 896px;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
            overflow-y: auto;
        }

        @media (min-width: 480px) {
            .mobile-container {
                height: 85vh;
                border-radius: 40px;
                border: 2px solid #222;
            }
        }

        /* Top Bar */
        .top-bar {
            padding: 20px 20px 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-app {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #fff;
        }

        .admin-shield {
            background: #111;
            border: 1px solid #333;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }
        .admin-shield:hover {
            background: #222;
        }

        /* Profile Section */
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 15px 0;
        }

        .profile-wrapper {
            position: relative;
            width: 75px;
            height: 75px;
        }

        .profile-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #333;
            background-color: #1a1a1a;
        }

        .profile-edit-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background-color: #ffffff;
            color: #000;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Content Area */
        .content {
            padding: 0 20px 20px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            color: #888;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            background-color: #111111;
            border: 1px solid #262626;
            color: #ffffff;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: #666;
        }

        /* White Action Button */
        .btn-white {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn-white:hover {
            opacity: 0.9;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 15px;
            font-size: 0.75rem;
            color: #555;
            letter-spacing: 0.5px;
        }

        /* --- NOTIFICAÇÃO COMPACTA ESTILO BANCO (CENTRALIZADA LÁ EM CIMA) --- */
        #bank-notification {
            position: fixed;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 390px;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 12px 14px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #bank-notification.show {
            top: 15px;
        }

        .notif-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .notif-content {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
        }

        .notif-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }

        .notif-app-name {
            font-size: 0.7rem;
            color: #aaa;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .notif-time {
            font-size: 0.65rem;
            color: #777;
        }

        .notif-text {
            font-size: 0.88rem;
            color: #f3f4f6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 400;
        }

        .notif-text b {
            font-weight: 600;
        }

        /* --- MODAL DE ADMINISTRAÇÃO --- */
        #admin-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 20px;
        }

        .admin-box {
            background: #111;
            border: 1px solid #333;
            width: 100%;
            max-width: 360px;
            padding: 24px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .admin-box h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .admin-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-close {
            background: #222;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            flex: 1;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-save {
            background: #fff;
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 8px;
            flex: 1;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- Top Bar com Escudo Administrativo -->
        <div class="top-bar">
            <div class="title-app" id="uiTitle">Gerador de Notificações</div>
            <div class="admin-shield" onclick="abrirAdmin()" title="Painel do Dono">🛡️</div>
        </div>

        <!-- Perfil do Usuário com Lápis -->
        <div class="profile-section">
            <div class="profile-wrapper">
                <img id="profileImg" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="profile-avatar" alt="Perfil">
                <div class="profile-edit-badge" onclick="document.getElementById('fileInput').click()">✏️</div>
                <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="mudarFoto(event)">
            </div>
        </div>

        <!-- Formulário Principal -->
        <div class="content">
            <div class="form-group">
                <label>Banco / Carteira</label>
                <select id="bancoSelect">
                    <option value="nubank">Nubank</option>
                    <option value="inter">Inter</option>
                    <option value="picpay">PicPay</option>
                    <option value="mercadopago">Mercado Pago</option>
                    <option value="caixatem">Caixa Tem</option>
                    <option value="bradesco">Bradesco</option>
                    <option value="ngcash">NG.CASH</option>
                    <option value="infinitepay">InfinitePay</option>
                </select>
            </div>

            <div class="form-group">
                <label>Nome do Pagador</label>
                <input type="text" id="nomePagador" value="Carlos Eduardo">
            </div>

            <div class="form-group">
                <label>Valor Recebido (R$)</label>
                <input type="text" id="valorPix" value="250,00">
            </div>

            <div class="form-group">
                <label>Som da Notificação</label>
                <select id="somSelect">
                    <option value="iphone">Toque do iPhone (Chime)</option>
                    <option value="android">Toque do Android (Beep)</option>
                </select>
            </div>

            <button class="btn-white" onclick="dispararNotificacao()" id="uiBtnText">Simular Notificação Pix</button>
        </div>

        <!-- Rodapé Editável -->
        <div class="footer" id="uiFooter">
            proprietário, uamaralhz@uamaralhz
        </div>
    </div>

    <!-- Notificação Realista Compacta -->
    <div id="bank-notification">
        <div class="notif-icon" id="notifIconBox">⚡</div>
        <div class="notif-content">
            <div class="notif-header-row">
                <span class="notif-app-name" id="notifAppName">Nubank</span>
                <span class="notif-time">agora</span>
            </div>
            <div class="notif-text" id="notifBodyText">Você recebeu um Pix de <b>R$ 250,00</b> de Carlos Eduardo</div>
        </div>
    </div>

    <!-- Modal de Administração (Dono) -->
    <div id="admin-modal">
        <div class="admin-box">
            <h3>Área de Administração</h3>
            <p style="font-size: 0.8rem; color: #888;">Edite os textos e configurações permanentes do sistema.</p>
            
            <div class="form-group">
                <label>Senha de Acesso</label>
                <input type="password" id="adminPass" placeholder="Digite a senha (padrão: admin)">
            </div>

            <div id="adminEditArea" style="display:none; flex-direction: column; gap: 12px;">
                <div class="form-group">
                    <label>Título do App no Topo</label>
                    <input type="text" id="editTitle" value="Gerador de Notificações">
                </div>
                <div class="form-group">
                    <label>Texto do Rodapé</label>
                    <input type="text" id="editFooter" value="proprietário, uamaralhz@uamaralhz">
                </div>
                <div class="form-group">
                    <label>Texto do Botão</label>
                    <input type="text" id="editBtn" value="Simular Notificação Pix">
                </div>
            </div>

            <div class="admin-actions">
                <button class="btn-close" onclick="fecharAdmin()">Fechar</button>
                <button class="btn-save" onclick="salvarAdmin()">Salvar</button>
            </div>
        </div>
    </div>

    <script>
        // Configurações de Bancos (Cores e Ícones)
        const bancosConfig = {
            nubank: { nome: 'Nubank', cor: '#820AD1', icone: 'Nu' },
            inter: { nome: 'Banco Inter', cor: '#FF7A00', icone: 'Inter' },
            picpay: { nome: 'PicPay', cor: '#11C76F', iconBg: '#11C76F', icone: 'Pay' },
            mercadopago: { nome: 'Mercado Pago', cor: '#009EE3', icone: 'MP' },
            caixatem: { nome: 'Caixa Tem', cor: '#005CA9', icone: 'CX' },
            bradesco: { nome: 'Bradesco', cor: '#CC092F', icone: 'Brad' },
            ngcash: { nome: 'NG.CASH', cor: '#68F588', icone: 'NG' },
            infinitepay: { nome: 'InfinitePay', cor: '#00D1FF', icone: 'Inf' }
        };

        // Carregar dados salvos (persistência permanente)
        window.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem('appTitle')) document.getElementById('uiTitle').innerText = localStorage.getItem('appTitle');
            if(localStorage.getItem('appFooter')) document.getElementById('uiFooter').innerText = localStorage.getItem('appFooter');
            if(localStorage.getItem('appBtn')) document.getElementById('uiBtnText').innerText = localStorage.getItem('appBtn');
            if(localStorage.getItem('userAvatar')) document.getElementById('profileImg').src = localStorage.getItem('userAvatar');
        });

        // Trocar foto de perfil
        function mudarFoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64 = e.target.result;
                    document.getElementById('profileImg').src = base64;
                    localStorage.setItem('userAvatar', base64);
                }
                reader.readAsDataURL(file);
            }
        }

        // Disparar Notificação Compacta
        function dispararNotificacao() {
            const bancoKey = document.getElementById('bancoSelect').value;
            const banco = bancosConfig[bancoKey];
            const nome = document.getElementById('nomePagador').value || "Alguém";
            const valor = document.getElementById('valorPix').value || "0,00";
            const somTipo = document.getElementById('somSelect').value;

            // Configurar visual do banco na notificação
            const iconBox = document.getElementById('notifIconBox');
            iconBox.innerText = banco.icone;
            iconBox.style.backgroundColor = banco.cor;
            iconBox.style.color = '#fff';

            document.getElementById('notifAppName').innerText = banco.nome;
            document.getElementById('notifBodyText').innerHTML = `Você recebeu um Pix de <b>R$ ${valor}</b> de ${nome}`;

            const notif = document.getElementById('bank-notification');
            notif.classList.add('show');

            tocarSom(somTipo);

            setTimeout(() => {
                notif.classList.remove('show');
            }, 4000);
        }

        // Sistema de Som (iPhone / Android)
        function tocarSom(tipo) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                
                if (tipo === 'iphone') {
                    // Toque estilo iPhone (Tri-tone / Chime harmônico)
                    tocarNota(ctx, 587.33, 0, 0.08); // D5
                    tocarNota(ctx, 880.00, 0.08, 0.12); // A5
                } else {
                    // Toque Android (Beep limpo padrão)
                    tocarNota(ctx, 1046.50, 0, 0.1); // C6
                }
            } catch (e) {
                // Áudio bloqueado pelo navegador antes de interação
            }
        }

        function tocarNota(ctx, freq, inicio, duracao) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + inicio);
            
            gain.gain.setValueAtTime(0.15, ctx.currentTime + inicio);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + inicio + duracao);
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            osc.start(ctx.currentTime + inicio);
            osc.stop(ctx.currentTime + inicio + duracao);
        }

        // Área de Administração
        function abrirAdmin() {
            document.getElementById('admin-modal').style.display = 'flex';
        }

        function fecharAdmin() {
            document.getElementById('admin-modal').style.display = 'none';
            document.getElementById('adminPass').value = '';
            document.getElementById('adminEditArea').style.display = 'none';
        }

        function salvarAdmin() {
            const pass = document.getElementById('adminPass').value;
            const editArea = document.getElementById('adminEditArea');

            if (pass === 'admin' || editArea.style.display === 'flex') {
                if (editArea.style.display !== 'flex') {
                    // Autenticado com sucesso, mostra os campos de edição
                    editArea.style.display = 'flex';
                    document.getElementById('editTitle').value = document.getElementById('uiTitle').innerText;
                    document.getElementById('editFooter').value = document.getElementById('uiFooter').innerText;
                    document.getElementById('editBtn').value = document.getElementById('uiBtnText').innerText;
                    alert('Senha correta! Agora faça as edições e clique em Salvar novamente.');
                    return;
                }

                // Salvar dados em tempo real e de forma permanente
                const novoTitulo = document.getElementById('editTitle').value;
                const novoRodape = document.getElementById('editFooter').value;
                const novoBtn = document.getElementById('editBtn').value;

                document.getElementById('uiTitle').innerText = novoTitulo;
                document.getElementById('uiFooter').innerText = novoRodape;
                document.getElementById('uiBtnText').innerText = novoBtn;

                localStorage.setItem('appTitle', novoTitulo);
                localStorage.setItem('appFooter', novoRodape);
                localStorage.setItem('appBtn', novoBtn);

                fecharAdmin();
                alert('Alterações salvas com sucesso!');
            } else {
                alert('Senha incorreta!');
            }
        }
    </script>
</body>
</html>
