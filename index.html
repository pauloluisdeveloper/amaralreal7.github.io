<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Financeiro - Nubank Estilo</title>
    <!-- Tailwind CSS para estilização rápida e moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilização personalizada em Preto e Branco puro */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .card-custom {
            background-color: #121212;
            border: 1px solid #262626;
        }
        .card-custom:hover {
            border-color: #404040;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- Topo / Cabeçalho -->
    <header class="max-w-md mx-auto w-full flex justify-between items-center mb-6">
        <div class="flex items-center space-x-3">
            <!-- Avatar / Foto de Perfil Editável -->
            <div class="w-12 h-12 rounded-full bg-white text-black flex items-center justify-center font-bold text-lg overflow-hidden border border-white">
                <span id="user-initials">EU</span>
            </div>
            <div>
                <h1 class="text-lg font-semibold" id="greeting">Olá, Usuário</h1>
            </div>
        </div>
        <div class="flex space-x-4">
            <!-- Botão de Visibilidade do Saldo -->
            <button onclick="toggleBalance()" class="p-2 rounded-full card-custom text-white hover:bg-neutral-800 transition">
                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-md mx-auto w-full space-y-6">

        <!-- Card de Saldo da Conta -->
        <section class="card-custom rounded-2xl p-5 shadow-lg">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm text-neutral-400 font-medium">Conta</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-neutral-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </div>
            <div class="text-2xl font-bold tracking-tight" id="balance-container">
                <span id="balance-text">R$ 5.430,21</span>
            </div>
        </section>

        <!-- Atalhos Rápidos (Horizontal Scroll) -->
        <section class="overflow-x-auto pb-2 scrollbar-none">
            <div class="flex space-x-4 min-w-max">
                <!-- Botão Atalho -->
                <div class="flex flex-col items-center space-y-2 cursor-pointer group">
                    <div class="w-16 h-16 rounded-full card-custom flex items-center justify-center group-hover:bg-neutral-800 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                    </div>
                    <span class="text-xs text-neutral-300 font-medium">Pix</span>
                </div>
                <div class="flex flex-col items-center space-y-2 cursor-pointer group">
                    <div class="w-16 h-16 rounded-full card-custom flex items-center justify-center group-hover:bg-neutral-800 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                        </svg>
                    </div>
                    <span class="text-xs text-neutral-300 font-medium">Pagar</span>
                </div>
                <div class="flex flex-col items-center space-y-2 cursor-pointer group">
                    <div class="w-16 h-16 rounded-full card-custom flex items-center justify-center group-hover:bg-neutral-800 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </div>
                    <span class="text-xs text-neutral-300 font-medium">Pegar Empréstimo</span>
                </div>
                <div class="flex flex-col items-center space-y-2 cursor-pointer group">
                    <div class="w-16 h-16 rounded-full card-custom flex items-center justify-center group-hover:bg-neutral-800 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                        </svg>
                    </div>
                    <span class="text-xs text-neutral-300 font-medium">Investir</span>
                </div>
            </div>
        </section>

        <!-- Seção do Cartão de Crédito -->
        <section class="card-custom rounded-2xl p-5 shadow-lg">
            <div class="flex justify-between items-center mb-3">
                <span class="text-sm font-semibold">Cartão de Crédito</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-neutral-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </div>
            <div class="text-xs text-neutral-400 mb-1">Fatura atual</div>
            <div class="text-xl font-bold mb-3">R$ 1.250,80</div>
            <div class="text-xs text-neutral-400">Limite disponível: <span class="text-white font-medium">R$ 3.749,20</span></div>
        </section>

        <!-- Histórico / Histórico de Transações Editável -->
        <section class="card-custom rounded-2xl p-5 shadow-lg space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-semibold">Histórico</h3>
                <span class="text-xs text-neutral-400 cursor-pointer hover:underline">Ver tudo</span>
            </div>
            <div class="space-y-3" id="transaction-list">
                <!-- Item dinâmico 1 -->
                <div class="flex justify-between items-center text-sm">
                    <div>
                        <p class="font-medium">Supermercado Extra</p>
                        <p class="text-xs text-neutral-500">Hoje, 14:20</p>
                    </div>
                    <span class="font-semibold">- R$ 150,00</span>
                </div>
                <!-- Item dinâmico 2 -->
                <div class="flex justify-between items-center text-sm">
                    <div>
                        <p class="font-medium">Salário Recebido</p>
                        <p class="text-xs text-neutral-500">Ontem</p>
                    </div>
                    <span class="font-semibold text-white">+ R$ 4.500,00</span>
                </div>
            </div>
        </section>

    </main>

    <!-- Rodapé / Painel de Configuração Rápida (Edição Direta) -->
    <footer class="max-w-md mx-auto w-full mt-8 pt-4 border-t border-neutral-800 text-center">
        <p class="text-xs text-neutral-500 mb-2">Painel Editável em Tempo Real</p>
        <div class="flex justify-center space-x-2">
            <button onclick="editData()" class="px-4 py-2 bg-white text-black text-xs font-bold rounded-lg hover:bg-neutral-200 transition">
                Editar Dados
            </button>
        </div>
    </footer>

    <!-- Script de Interatividade -->
    <script>
        let isBalanceVisible = true;

        function toggleBalance() {
            isBalanceVisible = !isBalanceVisible;
            const balanceText = document.getElementById('balance-text');
            if (isBalanceVisible) {
                balanceText.innerText = "R$ 5.430,21";
            } else {
                balanceText.innerText = "••••••••";
            }
        }

        function editData() {
            const novoNome = prompt("Digite o novo nome do usuário:", "Usuário");
            if (novoNome) {
                document.getElementById('greeting').innerText = `Olá, ${novoNome}`;
                document.getElementById('user-initials').innerText = novoNome.substring(0, 2).toUpperCase();
            }

            const novoSaldo = prompt("Digite o novo saldo da conta:", "5430.21");
            if (novoSaldo) {
                document.getElementById('balance-text').innerText = `R$ ${Number(novoSaldo).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
            }
        }
    </script>
</body>
</html>
