<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Pagamento Pix</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .checkout-box {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .preco {
            font-size: 28px;
            color: #27ae60;
            font-weight: bold;
            margin-bottom: 20px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }
        button:hover {
            background-color: #219653;
        }
        .pix-container {
            margin-top: 20px;
            display: none;
        }
        textarea {
            width: 100%;
            height: 80px;
            margin-top: 10px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: none;
            font-size: 12px;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #e67e22;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="checkout-box">
    <h2>Liberação de Acesso</h2>
    <p>Pagamento via Pix</p>
    <div class="preco">R$ 5,99</div>

    <!-- Botão que gera o Pix e regista o clique -->
    <button onclick="gerarPix()">Gerar Pix para Pagamento</button>

    <div id="pixArea" class="pix-container">
        <p><b>Copia e Cola:</b></p>
        <textarea id="copiaECola" readonly></textarea>
        <button onclick="copiarTexto()" style="background-color: #34495e;">Copiar Código Pix</button>
        <div id="statusPagamento" class="status">A aguardar pagamento...</div>
    </div>
</div>

<script>
    // Substitui pela URL da tua Web App do Google Apps Script
    const URL_APPS_SCRIPT = "COLOCA_AQUI_A_TUA_URL_DO_WEB_APP";
    
    // Gera um ID único para o dispositivo/cliente atual se não existir
    let deviceId = localStorage.getItem("device_id");
    if (!deviceId) {
        deviceId = "dev_" + Math.random().toString(36).substring(2, 11);
        localStorage.setItem("device_id", deviceId);
    }

    async function gerarPix() {
        // Regista o clique imediatamente na planilha
        fetch(URL_APPS_SCRIPT, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ acao: "registrar_clique", deviceId: deviceId, valor: "5.99" })
        }).catch(err => console.log("Erro ao registar clique:", err));

        // Pede a geração do Pix ao Apps Script
        try {
            let resposta = await fetch(URL_APPS_SCRIPT, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ acao: "gerar_pix", deviceId: deviceId, valor: "5.99" })
            });

            let resultado = await resposta.json();

            if (resultado.status === "sucesso") {
                document.getElementById("copiaECola").value = resultado.copiaECola;
                document.getElementById("pixArea").style.display = "block";
                
                // Começa a verificar se o pagamento foi aprovado a cada 5 segundos
                iniciarVerificacao();
            } else {
                alert("Erro ao gerar Pix. Tenta novamente.");
            }
        } catch (erro) {
            alert("Erro de conexão com o servidor.");
            console.error(erro);
        }
    }

    function copiarTexto() {
        let textarea = document.getElementById("copiaECola");
        textarea.select();
        document.execCommand("copy");
        alert("Código Pix copiado com sucesso!");
    }

    function iniciarVerificacao() {
        let intervalo = setInterval(async () => {
            try {
                let resposta = await fetch(URL_APPS_SCRIPT, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ acao: "verificar", deviceId: deviceId })
                });

                let resultado = await resposta.json();

                if (resultado.status === "liberado") {
                    clearInterval(intervalo);
                    document.getElementById("statusPagamento").style.color = "#27ae60";
                    document.getElementById("statusPagamento").innerText = "Pagamento Aprovado! A liberar acesso...";
                    setTimeout(() => {
                        window.location.href = "sucesso.html"; // Podes mudar para a página de destino final
                    }, 2000);
                }
            } catch (erro) {
                console.error("Erro na verificação:", erro);
            }
        }, 5000);
    }
</script>

</body>
</html>
