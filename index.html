<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Pix - Checkout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 320px;
            text-align: center;
        }
        h2 { margin-bottom: 20px; color: #a55eea; }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label { font-size: 12px; color: #b2bec3; }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background-color: #2d3436;
            border: 1px solid #636e72;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #8854d0;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #a55eea; }
        #resultado { margin-top: 15px; font-size: 14px; word-break: break-all; color: #00b894; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Nubank / Pix</h2>
        
        <div class="input-group">
            <label>Nome do Pagador</label>
            <input type="text" id="nomePagador" value="Carlos Eduardo">
        </div>

        <div class="input-group">
            <label>Valor Recebido (R$)</label>
            <input type="text" id="valorRecebido" value="250,00">
        </div>

        <button onclick="gerarPix()">Gerar Notificação Pix</button>
        
        <div id="resultado"></div>
    </div>

    <script>
        // Cole aqui a sua URL nova do Google Apps Script (terminada em /exec)
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbz5vmEmfea0DcnJTKli0kiwAfjK2sz2AS-fAYQzr9xFVbGreQth1DjsViBSDkctjS67/exec";

        async function gerarPix() {
            const resultadoDiv = document.getElementById("resultado");
            resultadoDiv.innerHTML = "A gerenciar Pix...";

            const dados = {
                acao: "gerar_pix",
                valor: document.getElementById("valorRecebido").value,
                nome: document.getElementById("nomePagador").value,
                deviceId: "DEV-WMDA2J"
            };

            try {
                const resposta = await fetch(URL_SCRIPT, {
                    method: "POST",
                    body: JSON.stringify(dados)
                });

                const json = await resposta.json();

                if (json.status === "sucesso") {
                    resultadoDiv.innerHTML = `<strong>Pix Gerado com Sucesso!</strong><br><br><span style="font-size:11px;">${json.copiaECola}</span>`;
                } else {
                    resultadoDiv.innerHTML = "Erro ao gerar Pix.";
                }
            } catch (erro) {
                resultadoDiv.innerHTML = "Falha de conexão ao gerar o Pix.";
                console.error(erro);
            }
        }
    </script>
</body>
</html>
