<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Notificação Pix</title>
    <style>
        :root {
            --pix-green: #32BCAD;
            --pix-dark-green: #117A65;
            --bg-color: #f4f6f8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Estilo do container de controle */
        .control-panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 320px;
        }

        .control-panel h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #333;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        button {
            width: 100%;
            background-color: var(--pix-green);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--pix-dark-green);
        }

        /* --- ESTILO DA NOTIFICAÇÃO (Estilo Banner Push) --- */
        #pix-notification {
            position: fixed;
            top: -100px; /* Começa escondida fora da tela */
            left: 50%;
            transform: translateX(-50%);
            background-color: #ffffff;
            color: #1f2937;
            width: 90%;
            max-width: 380px;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 1000;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-left: 6px solid var(--pix-green);
        }

        #pix-notification.show {
            top: 20px; /* Posição final na tela */
        }

        .pix-icon {
            background-color: rgba(50, 188, 173, 0.15);
            color: var(--pix-green);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .pix-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .pix-title {
            font-size: 0.8rem;
            color: #6b7280;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .pix-message {
            font-size: 0.95rem;
            color: #111827;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pix-amount {
            font-weight: 700;
            color: var(--pix-dark-green);
        }
    </style>
</head>
<body>

    <!-- Painel para simular e testar os dados -->
    <div class="control-panel">
        <h2>Simulador de Pix</h2>
        <div class="form-group">
            <label for="nomePagador">Nome de quem pagou:</label>
            <input type="text" id="nomePagador" value="Maria Silva Santos">
        </div>
        <div class="form-group">
            <label for="valorPix">Valor (R$):</label>
            <input type="text" id="valorPix" value="150,00">
        </div>
        <button onclick="dispararNotificacao()">Simular Notificação</button>
    </div>

    <!-- Elemento visual da Notificação -->
    <div id="pix-notification">
        <div class="pix-icon">R$</div>
        <div class="pix-details">
            <span class="pix-title">Pix Recebido</span>
            <span class="pix-message" id="textoNotificacao">Você recebeu <span class="pix-amount" id="spanValor">R$ 150,00</span> de <span id="spanNome">Maria Silva Santos</span></span>
        </div>
    </div>

    <script>
        function dispararNotificacao() {
            const nome = document.getElementById('nomePagador').value || "Alguém";
            const valor = document.getElementById('valorPix').value || "0,00";

            // Atualiza o texto com os valores inseridos
            document.getElementById('spanValor').innerText = `R$ ${valor}`;
            document.getElementById('spanNome').innerText = nome;

            const notificacao = document.getElementById('pix-notification');

            // Adiciona a classe que faz a notificação deslizar para baixo
            notificacao.classList.add('show');

            // Opcional: Tocar um som sutil de notificação (requer contexto de interação do usuário)
            tocarSomNotificacao();

            // Remove a notificação automaticamente após 4 segundos
            setTimeout(() => {
                notificacao.classList.remove('show');
            }, 4000);
        }

        function tocarSomNotificacao() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime); // Nota D5
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1); // Nota A5
                
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch (e) {
                // Navegador bloqueou áudio sem interação prévia ou WebAudio não suportado
            }
        }
    </script>
</body>
</html>
