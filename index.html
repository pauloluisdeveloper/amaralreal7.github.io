<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nubank</title>
    
    <!-- Configuração PWA / Ícone Automático Nubank na Tela Inicial -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nubank">
    
    <!-- Ícone Apple Touch Icon com a Logo Oficial Correta -->
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='112' fill='%23820AD1'/><path d='M120 190v158h55V235c0-15 10-25 25-25s25 10 25 25v113h55V235c0-15 10-25 25-25s25 10 25 25v113h55V190c0-38-24-58-67-58s-54 18-67 43c-13-25-24-43-67-43s-67 20-67 58z' fill='%23FFFFFF'/></svg>">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 15px;
        }

        /* Card VIP Compacto e Arredondado no Centro */
        .mobile-container {
            width: 100%;
            max-width: 360px;
            background-color: #0a0a0a;
            border: 1px solid #222222;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 15px 40px rgba(130, 10, 209, 0.12), 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
            padding: 24px;
        }

        /* Top Bar com Logo Oficial Nubank Perfeita */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
        }

        .nu-logo-box {
            width: 42px;
            height: 42px;
            background-color: #820AD1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(130, 10, 209, 0.45);
        }

        .nu-logo-box svg {
            width: 26px;
            height: 26px;
        }

        .title-app {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #fff;
        }

        /* Content Area */
        .content {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.75rem;
            color: #888;
            font-weight: 500;
        }

        input {
            width: 100%;
            background-color: #141414;
            border: 1px solid #282828;
            color: #ffffff;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #820AD1;
        }

        /* Botão Profissional Nubank */
        .btn-nu {
            background: linear-gradient(135deg, #820AD1 0%, #6805a8 100%);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
            box-shadow: 0 6px 20px rgba(130, 10, 209, 0.4);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-nu:active {
            transform: scale(0.98);
            box-shadow: 0 2px 10px rgba(130, 10, 209, 0.3);
        }

        /* Botão Secundário para Notificações Reais */
        .btn-outline {
            background-color: transparent;
            color: #aaa;
            border: 1px dashed #333;
            padding: 11px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }

        .btn-outline:hover {
            border-color: #820AD1;
            color: #fff;
        }

        /* Notificação Visual no Topo */
        #bank-notification {
            position: fixed;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 380px;
            background: rgba(20, 20, 20, 0.96);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(130, 10, 209, 0.3);
            color: #fff;
            padding: 12px 14px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #bank-notification.show {
            top: 20px;
        }

        .notif-icon {
            width: 36px;
            height: 36px;
            background-color: #820AD1;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .notif-icon svg {
            width: 22px;
            height: 22px;
        }

        .notif-content {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
        }

        .notif-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }

        .notif-app-name {
            font-size: 0.65rem;
            color: #b8b8b8;
            font-weight: 600;
            text-transform: uppercase;
        }

        .notif-time {
            font-size: 0.6rem;
            color: #777;
        }

        .notif-text {
            font-size: 0.85rem;
            color: #f3f4f6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .notif-text b {
            font-weight: 600;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Container VIP Compacto Arredondado no Centro -->
    <div class="mobile-container">
        <div class="top-bar">
            <div class="nu-logo-box">
                <!-- Vetor correto e idêntico ao da App Store do Nubank -->
                <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                    <path d="M120 190v158h55V235c0-15 10-25 25-25s25 10 25 25v113h55V235c0-15 10-25 25-25s25 10 25 25v113h55V190c0-38-24-58-67-58s-54 18-67 43c-13-25-24-43-67-43s-67 20-67 58z" fill="#FFFFFF"/>
                </svg>
            </div>
            <div class="title-app">Nubank</div>
        </div>

        <!-- Formulário Principal Exclusivo Nubank -->
        <div class="content">
            <div class="form-group">
                <label>Nome do Pagador</label>
                <input type="text" id="nomePagador" value="Carlos Eduardo">
            </div>

            <div class="form-group">
                <label>Valor Recebido (R$)</label>
                <input type="text" id="valorPix" value="250,00">
            </div>

            <button class="btn-nu" onclick="dispararNotificacao()">
                <span>Gerar Notificação Pix</span>
            </button>
            
            <button class="btn-outline" onclick="pedirPermissaoNotificacao()">🔔 Ativar Notificações Reais do Celular</button>
        </div>
    </div>

    <!-- Notificação Visual Interna no Topo -->
    <div id="bank-notification">
        <div class="notif-icon">
            <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                <path d="M120 190v158h55V235c0-15 10-25 25-25s25 10 25 25v113h55V235c0-15 10-25 25-25s25 10 25 25v113h55V190c0-38-24-58-67-58s-54 18-67 43c-13-25-24-43-67-43s-67 20-67 58z" fill="#FFFFFF"/>
            </svg>
        </div>
        <div class="notif-content">
            <div class="notif-header-row">
                <span class="notif-app-name">Nubank</span>
                <span class="notif-time">agora</span>
            </div>
            <div class="notif-text" id="notifBodyText">Você recebeu um Pix de <b>R$ 250,00</b> de Carlos Eduardo</div>
        </div>
    </div>

    <script>
        // Solicitar Permissão Real do Sistema Operacional
        function pedirPermissaoNotificacao() {
            if (!("Notification" in window)) {
                alert("Este navegador não suporta notificações nativas.");
                return;
            }

            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    alert("Notificações reais do Nubank ativadas com sucesso!");
                } else {
                    alert("Permissão negada. Ative nas configurações do seu celular.");
                }
            });
        }

        // Disparar Notificação (Real do Sistema + Visual Interna)
        function dispararNotificacao() {
            const nome = document.getElementById('nomePagador').value || "Carlos Eduardo";
            const valor = document.getElementById('valorPix').value || "250,00";

            // 1. Disparar Notificação Real na Tela de Bloqueio do Dispositivo
            if ("Notification" in window && Notification.permission === "granted") {
                try {
                    new Notification("Nubank", {
                        body: `Você recebeu um Pix de R$ ${valor} de ${nome}`,
                        tag: 'pix-nubank'
                    });
                } catch (e) {
                    console.log("Erro ao disparar notificação do sistema:", e);
                }
            }

            // 2. Disparar Notificação Visual Interna (Banner elegante no topo)
            document.getElementById('notifBodyText').innerHTML = `Você recebeu um Pix de <b>R$ ${valor}</b> de ${nome}`;

            const notif = document.getElementById('bank-notification');
            notif.classList.add('show');

            setTimeout(() => {
                notif.classList.remove('show');
            }, 4000);
        }
    </script>
</body>
</html>
